services:
  - type: web
    name: cdphmRH
    env: docker
    plan: starter
    branch: main
    dockerfilePath: Dockerfile
    startCommand: "apache2-foreground"
    buildCommand: ""
    healthCheckPath: "/"
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
