services:
  - type: web
    name: cdphmRH
    env: docker
    plan: starter
    branch: main
    dockerfilePath: Dockerfile
    startCommand: "apache2-foreground"
    buildCommand: ""
    healthCheckPath: "/"
    autoDeploy: false # déploiement manuel uniquement
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: mysql
      # Render n'héberge pas MySQL : renseigner dans le tableau de bord l'hôte d'une base MySQL externe.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
