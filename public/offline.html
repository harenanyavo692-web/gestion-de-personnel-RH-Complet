<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors ligne — Gestion des personnels</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FAF8F4;
      color: #23282B;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 380px;
    }
    .badge {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #14B8A6, #0B7A70);
      margin: 0 auto 20px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px;
    }
    p {
      color: #6B7280;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 20px;
    }
    button {
      background: #0D9488;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #0B7A70; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge"></div>
    <h1>Pas de connexion</h1>
    <p>Impossible de joindre l'espace RH pour le moment. Vérifiez votre connexion et réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
